<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>

  <!-- title -->
  <text x="20" y="32" font-size="18" font-weight="bold" fill="#111">LED test: MOSFET module switching an LED</text>
  <text x="20" y="52" font-size="12" fill="#555">A bench check of the switch before the vibrator: the LED stands in for the motor, and the module switches its minus side.</text>

  <!-- MOSFET module -->
  <rect x="380" y="120" width="180" height="220" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="392" y="142" font-size="12" font-weight="bold" fill="#222">MOSFET module</text>
  <text x="392" y="158" font-size="10" fill="#555">5-36 V, 15 A</text>
  <text x="392" y="172" font-size="10" fill="#555">D4184 (to check)</text>
  <text x="386" y="204" font-size="10" fill="#222">Trig</text>
  <text x="386" y="244" font-size="10" fill="#1f4e9c">GND</text>
  <text x="554" y="164" font-size="10" text-anchor="end" fill="#d68910">Vin+</text>
  <text x="554" y="204" font-size="10" text-anchor="end" fill="#222">Vout+</text>
  <text x="554" y="284" font-size="10" text-anchor="end" fill="#222">Vout-</text>
  <text x="476" y="326" font-size="10" fill="#1f4e9c">Vin-</text>

  <!-- signal in: GPIO2 on the ESP-01 -->
  <line x1="250" y1="200" x2="380" y2="200" stroke="#222" stroke-width="2"/>
  <text x="240" y="204" font-size="11" text-anchor="end" fill="#222">ESP-01 GPIO2</text>
  <text x="240" y="220" font-size="10" text-anchor="end" fill="#555">(or 3.3 V for a bench test)</text>
  <line x1="250" y1="240" x2="380" y2="240" stroke="#1f4e9c" stroke-width="2"/>
  <text x="240" y="244" font-size="11" text-anchor="end" fill="#1f4e9c">GND (ESP-01 GND)</text>

  <!-- power in: 5 V -->
  <line x1="700" y1="160" x2="560" y2="160" stroke="#c0392b" stroke-width="2"/>
  <text x="712" y="164" font-size="12" font-weight="bold" fill="#c0392b">5 V</text>
  <text x="712" y="180" font-size="10" fill="#555">CH340E 5V (USB) or boost OUT+</text>

  <!-- load: Vout+ -> R1 -> LED -> Vout- -->
  <line x1="560" y1="200" x2="600" y2="200" stroke="#222" stroke-width="2"/>
  <rect x="600" y="194" width="40" height="12" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <text x="620" y="188" font-size="10" text-anchor="middle" fill="#222">R1 150 Ω</text>
  <line x1="640" y1="200" x2="720" y2="200" stroke="#222" stroke-width="2"/>
  <line x1="720" y1="200" x2="720" y2="214" stroke="#222" stroke-width="2"/>
  <polygon points="708,214 732,214 720,232" fill="#ffffff" stroke="#222" stroke-width="2"/>
  <line x1="706" y1="234" x2="734" y2="234" stroke="#222" stroke-width="2"/>
  <text x="748" y="226" font-size="10" fill="#222">LED red</text>
  <line x1="720" y1="234" x2="720" y2="280" stroke="#222" stroke-width="2"/>
  <line x1="720" y1="280" x2="560" y2="280" stroke="#222" stroke-width="2"/>

  <!-- ground -->
  <line x1="470" y1="340" x2="470" y2="400" stroke="#1f4e9c" stroke-width="2"/>
  <text x="470" y="416" font-size="11" text-anchor="middle" fill="#1f4e9c">GND</text>

  <!-- current note -->
  <text x="600" y="330" font-size="10" fill="#555">About 20 mA: (5 V - 2 V) / 150 Ω</text>

  <!-- notes -->
  <text x="20" y="460" font-size="11" fill="#444">The module switches the LED's minus side (Vout-) to Vin- (ground) through its MOSFET. Trig high should switch it on (check: the module's LED lights when it is on).</text>
  <text x="20" y="478" font-size="11" fill="#444">Vout+ is tied to Vin+ inside the module, so the LED gets the 5 V. Check with a meter before relying on it. The same check applies to the vibrator.</text>
  <text x="20" y="496" font-size="11" fill="#444">The LED is not an inductive load, so it needs no flyback diode. The vibrator motor does: see the README.</text>
</svg>
